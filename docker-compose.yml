services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: keicy
      POSTGRES_PASSWORD: keicy
      POSTGRES_DB: keicy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keicy"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
